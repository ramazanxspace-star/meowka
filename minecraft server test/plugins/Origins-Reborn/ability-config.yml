origins:
  goblin_large_body:
    # Специальные настройки для гоблина  
    scale: 2
    attribute-modifier:
      operation: MULTIPLY_SCALAR_1
      expression: 0.1 # x = 0.1
  goblin_gold_bonus:
    # Бонус к дропу золота с мобов
    mobs:
      minecraft:zombified_piglin:
        gold_nugget:
          base_chance: 0.3
          bonus_chance: 0.5
        gold_ingot:
          base_chance: 0.1
          bonus_chance: 0.3
      minecraft:piglin:
        gold_nugget:
          base_chance: 0.4
          bonus_chance: 0.6
  
  goblin_treasure_hunter:
    # Бонус к луту из сундуков при ношении золотой брони
    chest_loot_multiplier: 1.5
    fishing_loot_multiplier: 1.5
    condition:
      type: origins:wearing_armor
      armor_type: gold
  
  goblin_gold_affinity:
    # Бонусы от золотой экипировки
    armor_bonus:
      gold:
        protection: 1
        toughness: 0.5
    tool_bonus:
      gold:
        efficiency: 1
        durability: 50
  small_bodyx:
    # Параметры для роста 1.5 блока
    scale: 0.833 # 1.5 / 1.8 = 0.833
    eye_height: 1.3 # Высота глаз от земли
    hitbox_height: 1.5 # Высота хитбокса
    attribute-modifier:
      operation: MULTIPLY_SCALAR_1
      expression: x
  # СПОСОБНОСТИ ДВОРФА
  dwarf_sun_sensitivity:
    effect: minecraft:blindness
    condition:
      type: origins:exposed_to_sun
      inverted: true
    helmet_condition:
      type: origins:equipped_item
      equipment_slot: head
      item_condition:
        type: origins:ingredient
        ingredient:
          item: minecraft:golden_helmet
  
  dwarf_mining_speed:
    attribute-modifier:
      operation: MULTIPLY_BASE
      value: 0.5
      attribute: minecraft:player.block_break_speed
  
  dwarf_water_weakness:
    effect: minecraft:slowness
    condition:
      type: origins:in_rain
      inverted: false
    amplifier: 1
  cat_vision:
    # Сила эффекта ночного зрения (0 = I уровень, 1 = II уровень и т.д.)
    effect_level: 0
  nekomata_weak_arms:
    # Множитель скорости копания. 0.6 = 60% от стандартной скорости (т.е. на 40% медленнее)
    break_speed_multiplier: 0.6
  nekomata_paws:
    # Длительность эффекта замедления при атаке голыми руками (в тиках). 20 тиков = 1 секунда.
    slowness_duration: 60 # 3 секунды
    # Уровень эффекта замедления (0 = I уровень, 1 = II уровень и т.д.)
    slowness_amplifier: 0
    # Дополнительный урон голыми руками (будет добавлен к стандартному урону)
    bonus_attack_damage: 2.0
    # Кулдаун между применениями эффекта (в тиках)
    cooldown: 60 # 3 секунды
  pumpkin_hate:
    # Poison the player when consuming pumpkin pie rather than preventing them from eating it
    consume_and_poison: false
  weak_arms:
    # Blocks that count as natural stone
    natural_stones:
    - minecraft:stone
    - minecraft:tuff
    - minecraft:granite
    - minecraft:diorite
    - minecraft:andesite
    - minecraft:sandstone
    - minecraft:smooth_sandstone
    - minecraft:red_sandstone
    - minecraft:smooth_red_sandstone
    - minecraft:deepslate
    - minecraft:blackstone
    - minecraft:netherrack
  fragile:
    attribute-modifier:
      # The operation to use ('ADD_SCALAR', 'ADD_NUMBER' or 'MULTIPLY_SCALAR_1')
      operation: ADD_NUMBER
      # A mathematical expression used to modify the attribute, where 'x' is a variable representing the default modifier.
      # Example: 'x * 3' will triple the value used in the modifier.
      expression: x
